<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brot Viewer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0e1014; --panel: #161a21; --line: #262c36; --text: #d8dde6; --muted: #8a93a3; --accent: #7fb2ff;
    font: 14px/1.4 system-ui, sans-serif; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 16px; overflow-y: auto; }
  main { position: relative; min-width: 0; }
  #view { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #view:active { cursor: grabbing; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 10px 0 6px; }
  legend { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 0 6px 0 0; }
  label { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 8px; margin: 6px 0; }
  select, input[type=number], button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  output { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  .c4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .c4 input { width: 100%; padding: 3px 4px; }
  .off { opacity: .4; pointer-events: none; }
  .row { display: flex; gap: 6px; margin: 8px 0; }
  #status { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
  #picker { position: absolute; top: 12px; left: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 320px; box-shadow: 0 8px 24px #0008; }
  #picker header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #cMap { width: 300px; height: 240px; display: block; border-radius: 4px; cursor: crosshair; }
  #guideNote { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; } aside { border-right: 0; } }
</style>
</head>
<body>
<aside>
  <h1>Brot Viewer</h1>
  <p class="sub">Bristorian and quaternion sets, assembled from CodeT blocks.</p>

  <fieldset>
    <legend>Set</legend>
    <label>Formula <select id="set"></select></label>
    <label>Variant
      <select id="julia"><option value="0">Mandelbrot</option><option value="1">Julia</option></select></label>
  </fieldset>

  <fieldset id="cRow">
    <legend>Julia C (real, e1, e2, e3)</legend>
    <div class="c4"><input id="c0" type="number" step="0.01"><input id="c1" type="number" step="0.01"><input id="c2" type="number" step="0.01"><input id="c3" type="number" step="0.01"></div>
    <div class="row"><button id="pick">Pick C</button></div>
  </fieldset>

  <fieldset>
    <legend>Section</legend>
    <label>Cut <select id="axis"><option value="0">β section</option><option value="1">axis (x, y, z, w)</option></select></label>
    <label>β <input id="beta" type="range" min="0" max="6.2832" step="0.01"><output id="betaOut"></output></label>
    <label>w <input id="w" type="range" min="-1" max="1" step="0.01"><output id="wOut"></output></label>
    <label>roll θ <input id="theta" type="range" min="0" max="6.2832" step="0.01"><output id="thetaOut"></output></label>
    <label title="or shift-drag the view">spin φ <input id="spin" type="range" min="-3.1416" max="3.1416" step="0.01"><output id="spinOut"></output></label>
  </fieldset>

  <fieldset>
    <legend>Light</legend>
    <label>Shadow <select id="shadow"><option value="0">off</option><option value="1">soft (refines to area light)</option></select></label>
    <label id="lightRow">Light az <input id="lightAz" type="range" min="-3.1416" max="3.1416" step="0.01"><output id="lightAzOut"></output></label>
    <label id="lightElRow">Light el <input id="lightEl" type="range" min="-0.3" max="1.55" step="0.01"><output id="lightElOut"></output></label>
    <label id="lightSizeRow">Light size <input id="lightSize" type="range" min="0.005" max="0.3" step="0.005"><output id="lightSizeOut"></output></label>
    <label id="shadowStepsRow">Shadow steps <select id="shadowSteps"><option value="16">16</option><option value="24">24</option><option value="32">32</option></select></label>
  </fieldset>

  <fieldset>
    <legend>Finish</legend>
    <label>Still refine <select id="refine"><option value="0">off</option><option value="16">16 samples</option><option value="64">64 samples</option><option value="256">256 samples</option></select></label>
    <label>Edge smoothing <select id="post"><option value="off">off</option><option value="luma">visible edges</option><option value="steps">geometry edges</option><option value="both">both (recommended)</option><option value="all">every pixel</option></select></label>
    <label>Mist <input id="mist" type="range" min="0" max="1.5" step="0.01"><output id="mistOut"></output></label>
    <label>Mist mode <select id="mistMode"><option value="edge">edge (near misses)</option><option value="coat">coat (film)</option><option value="edgecoat">edge + coat dusting</option></select></label>
    <label id="mistCoatRow">Coat dusting <input id="mistCoat" type="range" min="0" max="1.5" step="0.01"><output id="mistCoatOut"></output></label>
    <label>Mist film <input id="mistW" type="range" min="0.25" max="4" step="0.05"><output id="mistWOut"></output></label>
  </fieldset>

  <fieldset>
    <legend>March</legend>
    <label>Quality <select id="quality"><option value="live">Live</option><option value="fine">Fine</option><option value="visual">Visual</option></select></label>
    <label>Leash <select id="leash"><option value="1.5">1.5 tight</option><option value="3">3 balanced</option><option value="8">8 fast</option></select></label>
    <label>Iterations <select id="iters"><option>24</option><option>48</option><option>96</option></select></label>
    <label>View <select id="viewMode"><option value="0">shaded</option><option value="1">normals</option><option value="2">march steps</option><option value="3">hit mask</option></select></label>
  </fieldset>

  <div class="row"><button id="share">Copy link</button><button id="resetCam">Reset camera</button></div>
  <p class="sub">Drag to orbit · shift-drag to spin the body · wheel to zoom.</p>
</aside>

<main>
  <canvas id="view"></canvas>
  <div id="status"></div>
  <div id="picker" hidden>
    <header><strong>Pick C</strong><span id="guideTheta"></span><button id="closePicker">Close ×</button></header>
    <canvas id="cMap" width="300" height="240"></canvas>
    <label id="rollRow">slice θ <input id="guideRoll" type="range" min="-3.1416" max="3.1416" step="0.01" value="0"><output></output></label>
    <label id="bothRow" hidden>both brackets <input id="bothBrackets" type="checkbox"><output></output></label>
    <p id="guideNote"></p>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
